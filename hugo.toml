baseURL = 'https://uske2.github.io/'
locale = 'ja-jp'
defaultContentLanguage = 'ja'
title = 'うほうほうきうきクラブ'
theme = 'PaperMod'

# 日本語の文字数で要約・読了時間を計算する
hasCJKLanguage = true

# 記事のURL：/posts/<slug>/
[permalinks]
  posts = '/posts/:slug/'

# 分類：categories と tags
[taxonomies]
  category = 'categories'
  tag = 'tags'

[params]
  description = 'うほうほ、うきうきする記録'
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  defaultTheme = 'auto'

# ファビコン（ブラウザのタブ・iPhoneのホーム画面）。画像は static に置く
[params.assets]
  favicon = '/favicon.ico'
  favicon16x16 = '/favicon-16x16.png'
  favicon32x32 = '/favicon-32x32.png'
  apple_touch_icon = '/apple-touch-icon.png'

# サイト名の横のロゴ
[params.label]
  text = 'うほうほうきうきクラブ'
  icon = '/logo.png'
  iconHeight = 35

[params.homeInfoParams]
  Title = 'うほうほ、うきうきする毎日へ🦍'
  Content = '<strong style="font-size: 1.2em;">動く！読む！作る！学ぶ！積み重ねる！</strong><br>「トレーニング」「読書」「技術」「勉強」「ライフログ」の5つのジャングルで、今日もうほうほ活動中です🍌'

# 右上のメニュー：英語表記で統一（04_Skill/Obsidian_ブログ公開ルール.md 第7章）
[menus]
  [[menus.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 10
  [[menus.main]]
    name = 'Categories'
    pageRef = '/categories'
    weight = 20
  [[menus.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 30
  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 40

# Obsidianで書いたMarkdown内のHTMLをそのまま出せるようにする
[markup.goldmark.renderer]
  unsafe = true
