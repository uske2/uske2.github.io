baseURL = 'https://uske2.github.io/'
locale = 'ja-jp'
defaultContentLanguage = 'ja'
title = 'うほうほうきうきクラブ'
theme = 'PaperMod'

# 日本語の文字数で要約・読了時間を計算する
hasCJKLanguage = true

# 記事のURL：/posts/<slug>/
[permalinks]
  posts = '/posts/:slug/'

# 分類：categories と tags
[taxonomies]
  category = 'categories'
  tag = 'tags'

[params]
  description = 'うほうほ、うきうきする記録'
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  defaultTheme = 'auto'

[params.homeInfoParams]
  Title = 'うほうほ、うきうきする毎日へ！！'
  Content = '<strong style="font-size: 1.2em;">動く！読む！作る！学ぶ！積み重ねる！</strong><br>「トレーニング」「読書」「技術」「勉強」「ライフログ」の5つのジャングルで、今日もうほうほ活動中です🍌'

[menus]
  [[menus.main]]
    name = '記事'
    pageRef = '/posts'
    weight = 10
  [[menus.main]]
    name = 'カテゴリー'
    pageRef = '/categories'
    weight = 20
  [[menus.main]]
    name = 'タグ'
    pageRef = '/tags'
    weight = 30

# Obsidianで書いたMarkdown内のHTMLをそのまま出せるようにする
[markup.goldmark.renderer]
  unsafe = true
